<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZART — Հայկական զարդանախշով հագուստ</title>
<meta name="description" content="ZART — հայկական զարդանախշով հուդիներ, շապիկներ և աքսեսուարներ։ Կարված Երևանում։ Առաքում ամբողջ Հայաստանում։">
<meta name="theme-color" content="#0a0a09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a09'/%3E%3Cpath d='M16 5l3.2 7.8L27 16l-7.8 3.2L16 27l-3.2-7.8L5 16l7.8-3.2z' fill='%23c9a34a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">

<body>

<header class="site-header" id="header">
  <div class="wrap header-inner">
    <a class="brand" href="#/" aria-label="ZART">
      <span class="brand-mark">ZART</span>
      <span class="brand-arm">ԶԱՐԹ</span>
    </a>

    <nav class="nav" id="nav">
      <a href="#/catalog" data-i18n="nav.shop"></a>
      <a href="#/about" data-i18n="nav.about"></a>
      <a href="#/contact" data-i18n="nav.contact"></a>
    </nav>

    <div class="header-actions">
      <div class="lang" id="lang" role="group" aria-label="language"></div>
      <a class="icon-btn" href="#/account" id="accountBtn" title="account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-4 3.4-6.4 7.5-6.4s7.5 2.4 7.5 6.4"/></svg>
      </a>
      <a class="icon-btn cart-btn" href="#/cart" title="cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16l-1.4 12.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8L4 7z"/><path d="M9 7V5.6a3 3 0 0 1 6 0V7"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
      <button class="burger" id="burger" aria-label="menu"><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="view"></main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-brand">
        <span class="brand-mark">ZART</span>
        <p data-i18n="footer.tagline"></p>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.shop"></h4>
        <a href="#/catalog" data-i18n="nav.shop"></a>
        <a href="#/catalog?cat=hoodies" data-i18n="cat.hoodies"></a>
        <a href="#/catalog?cat=tees" data-i18n="cat.tees"></a>
        <a href="#/catalog?cat=caps" data-i18n="cat.caps"></a>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.help"></h4>
        <a href="#/about" data-i18n="nav.about"></a>
        <a href="#/contact" data-i18n="nav.contact"></a>
        <a href="#/account" data-i18n="account.title"></a>
      </div>
      <div class="footer-col" id="footerContacts">
        <h4 data-i18n="footer.contacts"></h4>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="footerCopy"></span>
      <a href="admin.html" class="admin-link" data-i18n="footer.admin"></a>
    </div>
  </div>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/js/i18n.js"></script>
