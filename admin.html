<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZART — Demo Admin</title><link rel="stylesheet" href="./style.css"><style>body{padding:30px 5vw}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.stat{padding:20px;background:#151411;border:1px solid #393329}.stat b{display:block;color:var(--gold);font-size:25px;margin-top:8px}.tabs{display:flex;gap:10px;margin:25px 0}.tabs button,.action{padding:11px 16px;background:#171613;border:1px solid #51452e;color:#d8c7a6;cursor:pointer}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form .field{margin:5px 0}.form button{grid-column:1/-1}.table{width:100%;border-collapse:collapse;margin-top:25px}.table td,.table th{padding:10px;border-bottom:1px solid #393329;text-align:left}.table input,.table select{width:100%;max-width:150px;background:#090909;color:#fff;border:1px solid #393329;padding:7px}.note{color:#c8a76a;line-height:1.7}.hidden{display:none}@media(max-width:650px){.grid,.form{grid-template-columns:1fr}.table{font-size:11px}.table td,.table th{padding:6px}}</style></head><body><div class="head"><a class="brand" href="./index.html">✧ ZART <small>DEMO ADMIN</small></a><a href="./index.html">← STORE</a></div><p class="note">ДЕМО-АДМИНКА: изменения сохраняются только в localStorage этого браузера. Это не защищённая серверная панель.</p><div class="grid"><div class="stat">Товары<b id="count">0</b></div><div class="stat">Демо-заказы<b id="orders">0</b></div><div class="stat">Выручка<b id="revenue">0 ֏</b></div></div><div class="tabs"><button onclick="tab('products')">ТОВАРЫ</button><button onclick="tab('orders')">ЗАКАЗЫ</button><button onclick="resetDemo()">СБРОСИТЬ ДЕМО</button></div><section id="productsTab"><h2>Добавить / изменить товар</h2><form id="form" class="form"><input type="hidden" name="id"><label class="field">Название HY<input name="name_hy" required></label><label class="field">Название RU<input name="name_ru" required></label><label class="field">Название EN<input name="name_en" required></label><label class="field">Категория<select name="category"><option value="hoodies">hoodies</option><option value="sweatshirts">sweatshirts</option><option value="accessories">accessories</option></select></label><label class="field">Описание HY<input name="desc_hy"></label><label class="field">Описание RU<input name="desc_ru"></label><label class="field">Описание EN<input name="desc_en"></label><label class="field">Цена AMD<input name="price" type="number" required></label><label class="field">Остаток<input name="stock" type="number" required></label><label class="field">Путь к фото (например ./assets/hoodie-pomegranate.png)<input name="image" required></label><button class="wide">СОХРАНИТЬ</button></form><div style="overflow:auto"><table class="table"><thead><tr><th>ID</th><th>Название</th><th>Цена</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="ordersTab" class="hidden"><h2>Демо-заказы</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Номер</th><th>Имя</th><th>Телефон</th><th>Сумма</th><th>Статус</th></tr></thead><tbody id="orderRows"></tbody></table></div></section><script src="./admin.js"></script></body></html>
